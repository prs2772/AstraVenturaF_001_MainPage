<div class="av-auth-container av-change-password">
  <div class="av-glass-panel">
    <!-- Orbital Header -->
    <div class="av-panel-header">
      <div class="av-status-dot"></div>
      <div class="av-panel-title">SECURITY_RECONFIG</div>
      <div class="av-panel-id">UX-7721</div>
    </div>

    <div class="av-panel-content">
      <h1 class="av-title">Modify Security Cipher</h1>
      <p class="av-subtitle">Update your orbital access credentials</p>

      <!-- Success State -->
      <div *ngIf="status === 'success'" class="av-success-feedback">
        <div class="av-success-icon">✓</div>
        <p>Security cipher successfully updated.</p>
        <button type="button" class="av-btn-primary" (click)="onAccept()">
          Accept & Continue
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="changeForm" (ngSubmit)="onSubmit()" *ngIf="status !== 'success'">
        
        <!-- Error Message -->
        <div *ngIf="status === 'error'" class="av-error-card">
          <span class="av-error-icon">⚠</span>
          <span class="av-error-text">{{ errorMsg }}</span>
        </div>

        <div class="av-form-group">
          <label class="av-label">Current Cipher</label>
          <div class="av-input-wrapper" [class.av-input--error]="currentPassword?.invalid && currentPassword?.touched">
            <input 
              type="password" 
              formControlName="currentPassword" 
              placeholder="Enter current password"
              class="av-input"
            >
            <div class="av-input-glow"></div>
          </div>
          <div *ngIf="currentPassword?.errors?.['required'] && currentPassword?.touched" class="av-field-error">
            Field required
          </div>
        </div>

        <div class="av-form-group">
          <label class="av-label">New Security Cipher</label>
          <div class="av-input-wrapper" [class.av-input--error]="newPassword?.invalid && newPassword?.touched">
            <input 
              type="password" 
              formControlName="newPassword" 
              placeholder="Strong password required"
              class="av-input"
            >
            <div class="av-input-glow"></div>
          </div>
          <div *ngIf="newPassword?.touched" class="av-field-error-list">
            <div *ngIf="newPassword?.errors?.['required']" class="av-field-error">
              Field required
            </div>
            <div *ngFor="let errorMsg of passwordErrors" class="av-field-error">
              - {{ errorMsg }}
            </div>
          </div>
        </div>

        <div class="av-form-group">
          <label class="av-label">Confirm New Cipher</label>
          <div class="av-input-wrapper" [class.av-input--error]="(confirmPassword?.invalid || changeForm.errors?.['mismatch']) && confirmPassword?.touched">
            <input 
              type="password" 
              formControlName="confirmPassword" 
              placeholder="Repeat new password"
              class="av-input"
            >
            <div class="av-input-glow"></div>
          </div>
          <div *ngIf="confirmPassword?.errors?.['required'] && confirmPassword?.touched" class="av-field-error">
            Confirmation required
          </div>
          <div *ngIf="changeForm.errors?.['mismatch'] && confirmPassword?.touched" class="av-field-error">
            Ciphers do not match
          </div>
        </div>

        <div class="av-form-actions">
          <button type="submit" class="av-btn-primary" [disabled]="status === 'loading'">
            <span *ngIf="status !== 'loading'">Commit Changes</span>
            <span *ngIf="status === 'loading'" class="av-loader"></span>
          </button>
          
          <a routerLink="/home" class="av-link av-abort">Abort Operation</a>
        </div>

      </form>
    </div>

    <!-- Cosmic Footer HUD -->
    <div class="av-panel-footer">
      <div class="av-telemetry">
        <span class="av-telemetry-item">SEC_LVL: MAX</span>
        <span class="av-telemetry-item">UPLINK: ACTIVE</span>
      </div>
    </div>
  </div>
</div>
